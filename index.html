<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Streaks</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      padding: 16px;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
      padding-top: 8px;
    }

    .date {
      font-size: 13px;
      color: #8b949e;
      margin-bottom: 2px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #8b949e;
      margin-bottom: 12px;
    }

    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .stat-box {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 12px 8px;
      text-align: center;
    }

    .stat-number {
      font-size: 22px;
      font-weight: 700;
      color: #39d353;
    }

    .stat-label {
      font-size: 11px;
      color: #8b949e;
      margin-top: 2px;
    }

    /* Habit buttons */
    .habits-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .habit-btn {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 16px 12px;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: left;
      position: relative;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .habit-btn.done {
      background: #0d4a1f;
      border-color: #39d353;
    }

    .habit-btn:active { transform: scale(0.97); }

    .habit-icon {
      font-size: 26px;
      display: block;
      margin-bottom: 8px;
    }

    .habit-name {
      font-size: 14px;
      font-weight: 500;
      display: block;
      margin-bottom: 4px;
    }

    .habit-streak {
      font-size: 11px;
      color: #8b949e;
    }

    .habit-btn.done .habit-streak { color: #39d353; }

    .checkmark {
      position: absolute;
      top: 10px;
      right: 12px;
      font-size: 15px;
      color: #39d353;
      display: none;
    }

    .habit-btn.done .checkmark { display: block; }

    .habit-value {
      display: none;
      margin-top: 10px;
      align-items: center;
      gap: 6px;
    }

    .habit-btn.done .habit-value { display: flex; }

    .habit-value input {
      width: 60px;
      background: #0d1117;
      border: 1px solid #39d353;
      border-radius: 6px;
      color: #e6edf3;
      font-size: 14px;
      padding: 3px 6px;
      text-align: center;
    }

    .habit-value .unit-label {
      font-size: 11px;
      color: #8b949e;
    }

    /* Heatmap */
    .heatmap-section { margin-top: 24px; }

    .heatmap {
      display: flex;
      gap: 3px;
      overflow-x: auto;
      padding-bottom: 6px;
    }

    .heatmap-week {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex-shrink: 0;
    }

    .heatmap-day {
      width: 12px;
      height: 12px;
      border-radius: 2px;
      background: #161b22;
    }

    .heatmap-day[data-level="1"] { background: #0e4429; }
    .heatmap-day[data-level="2"] { background: #006d32; }
    .heatmap-day[data-level="3"] { background: #26a641; }
    .heatmap-day[data-level="4"] { background: #39d353; }
    .heatmap-day.today { outline: 2px solid #e6edf3; outline-offset: 1px; }

    /* Add habit */
    .add-btn {
      width: 100%;
      background: transparent;
      border: 1px dashed #30363d;
      border-radius: 12px;
      color: #8b949e;
      padding: 14px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .add-btn:hover, .add-btn:active {
      border-color: #58a6ff;
      color: #58a6ff;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px 16px 0 0;
      padding: 24px;
      width: 100%;
      max-width: 480px;
    }

    .modal h2 { font-size: 16px; margin-bottom: 16px; }

    .modal input, .modal select {
      width: 100%;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #e6edf3;
      font-size: 14px;
      padding: 10px 12px;
      margin-bottom: 10px;
      outline: none;
    }

    .modal input:focus, .modal select:focus {
      border-color: #58a6ff;
    }

    .modal-btns {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }

    .btn-primary {
      flex: 1;
      background: #238636;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      padding: 12px;
      cursor: pointer;
    }

    .btn-primary:active { background: #1a6e2a; }

    .btn-cancel {
      flex: 1;
      background: transparent;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #8b949e;
      font-size: 14px;
      padding: 12px;
      cursor: pointer;
    }

    .export-btn {
      width: 100%;
      background: transparent;
      border: 1px solid #21262d;
      border-radius: 8px;
      color: #8b949e;
      padding: 10px;
      font-size: 12px;
      cursor: pointer;
      margin-top: 20px;
    }

    .export-btn:hover { border-color: #8b949e; color: #e6edf3; }

    .delete-habit {
      position: absolute;
      bottom: 8px;
      right: 10px;
      font-size: 14px;
      color: #8b949e;
      cursor: pointer;
      display: none;
      background: none;
      border: none;
      padding: 4px;
    }

    .habit-btn:hover .delete-habit { display: block; }
  </style>
</head>
<body>

<header>
  <div>
    <div class="date" id="dateDisplay"></div>
    <h1>Streaks</h1>
  </div>
</header>

<div class="stats">
  <div class="stat-box">
    <div class="stat-number" id="statToday">0/0</div>
    <div class="stat-label">Today</div>
  </div>
  <div class="stat-box">
    <div class="stat-number" id="statStreak">0</div>
    <div class="stat-label">Best streak</div>
  </div>
  <div class="stat-box">
    <div class="stat-number" id="statDays">0</div>
    <div class="stat-label">Days logged</div>
  </div>
</div>

<div class="section-title">Today</div>
<div class="habits-grid" id="habitsGrid"></div>
<button class="add-btn" onclick="openModal()">+ Add habit</button>

<div class="heatmap-section">
  <div class="section-title" style="margin-top:24px">This year</div>
  <div class="heatmap" id="heatmap"></div>
</div>

<button class="export-btn" onclick="exportData()">&#8595; Export data as JSON</button>

<!-- Add Habit Modal -->
<div class="modal-overlay" id="modal" onclick="handleOverlayClick(event)">
  <div class="modal">
    <h2>New habit</h2>
    <input type="text" id="habitName" placeholder="Name  (e.g. Exercise)" />
    <input type="text" id="habitIcon" placeholder="Emoji (e.g. 💪) — optional" />
    <select id="habitType">
      <option value="boolean">Checkmark only — done or not done</option>
      <option value="number">Number — reps, pages, minutes...</option>
      <option value="time">Time — e.g. wake up, sleep time</option>
    </select>
    <input type="text" id="habitUnit" placeholder="Unit label (e.g. reps) — for number type" />
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="addHabit()">Add habit</button>
    </div>
  </div>
</div>

<script>
const KEY = 'streaks_v1';

function load() {
  const raw = localStorage.getItem(KEY);
  if (raw) return JSON.parse(raw);
  return {
    habits: [
      { id: '1', name: 'Prayer',   icon: '🤲', type: 'boolean' },
      { id: '2', name: 'Exercise', icon: '💪', type: 'number', unit: 'reps' },
      { id: '3', name: 'Reading',  icon: '📚', type: 'boolean' },
      { id: '4', name: 'Sleep',    icon: '😴', type: 'time' }
    ],
    logs: {}
  };
}

function save(data) {
  localStorage.setItem(KEY, JSON.stringify(data));
}

function today() {
  return new Date().toISOString().slice(0, 10);
}

function getStreak(data, habitId) {
  let streak = 0;
  const d = new Date();
  while (true) {
    const key = d.toISOString().slice(0, 10);
    const log = (data.logs[key] || {})[habitId];
    if (log && log.done) {
      streak++;
      d.setDate(d.getDate() - 1);
    } else {
      break;
    }
  }
  return streak;
}

function getBestStreak(data) {
  const dates = Object.keys(data.logs).sort();
  let best = 0, cur = 0, prev = null;
  for (const date of dates) {
    const anyDone = Object.values(data.logs[date]).some(v => v.done);
    if (!anyDone) { cur = 0; prev = null; continue; }
    if (prev) {
      const p = new Date(prev);
      p.setDate(p.getDate() + 1);
      cur = p.toISOString().slice(0, 10) === date ? cur + 1 : 1;
    } else {
      cur = 1;
    }
    best = Math.max(best, cur);
    prev = date;
  }
  return best;
}

function render() {
  const data = load();
  const t = today();
  const todayLog = data.logs[t] || {};

  document.getElementById('dateDisplay').textContent = new Date().toLocaleDateString('en-US', {
    weekday: 'long', month: 'long', day: 'numeric'
  });

  const total = data.habits.length;
  const done = data.habits.filter(h => todayLog[h.id] && todayLog[h.id].done).length;
  document.getElementById('statToday').textContent = done + '/' + total;
  document.getElementById('statStreak').textContent = getBestStreak(data);
  document.getElementById('statDays').textContent = Object.keys(data.logs).length;

  const grid = document.getElementById('habitsGrid');
  grid.innerHTML = '';

  data.habits.forEach(habit => {
    const log = todayLog[habit.id] || {};
    const isDone = !!log.done;
    const streak = getStreak(data, habit.id);

    const btn = document.createElement('div');
    btn.className = 'habit-btn' + (isDone ? ' done' : '');

    let valueHtml = '';
    if (habit.type === 'number') {
      valueHtml = `<div class="habit-value" onclick="event.stopPropagation()">
        <input type="number" min="0" value="${log.value || ''}" placeholder="0"
          onchange="saveVal('${habit.id}', this.value)"
          onclick="event.stopPropagation()" />
        <span class="unit-label">${habit.unit || ''}</span>
      </div>`;
    } else if (habit.type === 'time') {
      valueHtml = `<div class="habit-value" onclick="event.stopPropagation()">
        <input type="time" value="${log.value || ''}" style="width:90px"
          onchange="saveVal('${habit.id}', this.value)"
          onclick="event.stopPropagation()" />
      </div>`;
    }

    btn.innerHTML = `
      <span class="checkmark">&#10003;</span>
      <button class="delete-habit" onclick="deleteHabit(event,'${habit.id}')">&#128465;</button>
      <span class="habit-icon">${habit.icon || '&#9711;'}</span>
      <span class="habit-name">${habit.name}</span>
      <span class="habit-streak">${streak > 0 ? '&#128293; ' + streak + ' day streak' : 'Start today'}</span>
      ${valueHtml}
    `;

    btn.addEventListener('click', () => toggle(habit.id));
    grid.appendChild(btn);
  });

  renderHeatmap(data);
}

function toggle(habitId) {
  const data = load();
  const t = today();
  if (!data.logs[t]) data.logs[t] = {};
  const cur = data.logs[t][habitId] || {};
  data.logs[t][habitId] = { ...cur, done: !cur.done };
  save(data);
  render();
}

function saveVal(habitId, value) {
  const data = load();
  const t = today();
  if (!data.logs[t]) data.logs[t] = {};
  if (!data.logs[t][habitId]) data.logs[t][habitId] = { done: true };
  data.logs[t][habitId].value = value;
  save(data);
}

function deleteHabit(event, habitId) {
  event.stopPropagation();
  const data = load();
  data.habits = data.habits.filter(h => h.id !== habitId);
  save(data);
  render();
}

function renderHeatmap(data) {
  const heatmap = document.getElementById('heatmap');
  heatmap.innerHTML = '';
  const t = today();
  const yearStart = t.slice(0, 4) + '-01-01';

  const allDates = [];
  const cur = new Date(yearStart);
  const end = new Date(t);
  while (cur <= end) {
    allDates.push(cur.toISOString().slice(0, 10));
    cur.setDate(cur.getDate() + 1);
  }

  const firstDow = new Date(yearStart).getDay();
  const padded = Array(firstDow).fill(null).concat(allDates);
  const total = data.habits.length || 1;

  for (let i = 0; i < padded.length; i += 7) {
    const week = padded.slice(i, i + 7);
    const col = document.createElement('div');
    col.className = 'heatmap-week';
    week.forEach(date => {
      const cell = document.createElement('div');
      cell.className = 'heatmap-day';
      if (date) {
        if (date === t) cell.classList.add('today');
        const log = data.logs[date] || {};
        const doneCount = Object.values(log).filter(v => v.done).length;
        const ratio = doneCount / total;
        if (ratio > 0.75) cell.dataset.level = '4';
        else if (ratio > 0.5) cell.dataset.level = '3';
        else if (ratio > 0.25) cell.dataset.level = '2';
        else if (ratio > 0) cell.dataset.level = '1';
        cell.title = date + (doneCount ? ` — ${doneCount}/${total} done` : '');
      } else {
        cell.style.visibility = 'hidden';
      }
      col.appendChild(cell);
    });
    heatmap.appendChild(col);
  }
}

function openModal() {
  document.getElementById('modal').classList.add('open');
  document.getElementById('habitName').focus();
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  ['habitName','habitIcon','habitUnit'].forEach(id => document.getElementById(id).value = '');
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('modal')) closeModal();
}

function addHabit() {
  const name = document.getElementById('habitName').value.trim();
  if (!name) { document.getElementById('habitName').focus(); return; }
  const data = load();
  data.habits.push({
    id: Date.now().toString(),
    name,
    icon: document.getElementById('habitIcon').value.trim() || '○',
    type: document.getElementById('habitType').value,
    unit: document.getElementById('habitUnit').value.trim()
  });
  save(data);
  closeModal();
  render();
}

function exportData() {
  const data = load();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'streaks-' + today() + '.json';
  a.click();
}

render();
</script>
</body>
</html>
